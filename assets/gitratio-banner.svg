<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">GitRatio — Software that gets out of the way</title>
<desc id="desc">Signature GitRatio profile banner with custom GR signal mark, dark graphite panels, blueprint lines and cool blue and silver typography.</desc>
<defs>
