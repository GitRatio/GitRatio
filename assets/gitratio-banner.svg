<radialGradient id="halo"><stop stop-color="#3D9CFA" stop-opacity=".23"/><stop offset="1" stop-color="#3D9CFA" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#AEC6DC" fill-opacity=".12"/></pattern>
<clipPath id="round"><rect width="1280" height="400" rx="20"/></clipPath>
</defs>
