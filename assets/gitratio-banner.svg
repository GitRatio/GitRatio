    <text x="61" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="99" letter-spacing="5" font-weight="800" fill="#EDF5FD">GIT<tspan fill="#69B9ED">RATIO</tspan></text>
    <text x="67" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="2.5" font-weight="500" fill="#A6B7C8">BROWSER TOOLS  /  DESKTOP APPS  /  CREATIVE SOFTWARE</text>
    <rect x="67" y="287" width="515" height="2" fill="url(#edge)" opacity=".75"/>
  </g>
