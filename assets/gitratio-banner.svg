<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">GitRatio — build, refine, ship</title>
  <desc id="desc">Midnight-blue developer banner with geometric connection points, silver typography, and blue accent lines.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1020"/><stop offset="0.6" stop-color="#101B30"/><stop offset="1" stop-color="#112741"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="0.55" stop-color="#60A5FA"/><stop offset="1" stop-color="#B8CCDF"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#3183C6" stop-opacity=".34"/><stop offset="1" stop-color="#3183C6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#85A4C0" stroke-opacity=".085" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect x="0" y="0" width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="320" fill="url(#back)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="1070" cy="145" r="300" fill="url(#glow)"/>
    <path d="M0 0H1280V320H0Z" fill="none" stroke="#415F7D" stroke-opacity=".28" stroke-width="2"/>
    <g opacity=".52" fill="none" stroke="#4D7498" stroke-width="1.5">
      <path d="M936 252 1025 170 1112 203 1191 102 1261 141"/>
      <path d="M1025 170 1039 80 1128 53 1191 102 1236 25"/>
      <path d="M1112 203 1164 278 1247 242"/>
    </g>
    <g fill="#101B30" stroke="#52A9E8" stroke-width="3">
      <circle cx="1025" cy="170" r="8"/><circle cx="1112" cy="203" r="8"/><circle cx="1191" cy="102" r="8"/>
    </g>
    <g fill="#95CDEE" opacity=".75"><circle cx="936" cy="252" r="4"/><circle cx="1039" cy="80" r="4"/><circle cx="1128" cy="53" r="4"/><circle cx="1236" cy="25" r="4"/><circle cx="1261" cy="141" r="4"/></g>
    <rect x="66" y="58" width="52" height="5" rx="2.5" fill="url(#edge)"/>
